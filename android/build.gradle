buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.2.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def getExtOrIntegerDefault(name) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties['RNTP_' + name]).toInteger()
}

android {
    compileSdkVersion getExtOrIntegerDefault('compileSdkVersion')
    namespace 'com.doublesymmetry.trackplayer'

    defaultConfig {
        minSdkVersion getExtOrIntegerDefault('minSdkVersion') // RN's minimum version
        targetSdkVersion getExtOrIntegerDefault('targetSdkVersion')

        versionCode 300
        versionName '3.0'

        consumerProguardFiles 'proguard-rules.txt'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // KotlinAudio v2.1.0, vendored (see src/vendor/kotlinaudio/VENDORED.md): built with this
    // library instead of the JitPack artifact.
    sourceSets {
        main {
            java.srcDirs += 'src/vendor/kotlinaudio/java'
            res.srcDirs += 'src/vendor/kotlinaudio/res'
        }
    }
}

def fallbackCodegenJniDir = file("$projectDir/src/main/jni/RNTrackPlayerSpec")
def generatedCodegenJniDir = file("$buildDir/generated/source/codegen/jni")

tasks.register('prepareFallbackCodegenJni') {
    inputs.dir(fallbackCodegenJniDir)
    outputs.dir(generatedCodegenJniDir)

    doLast {
        def generatedCMake = file("$generatedCodegenJniDir/CMakeLists.txt")
        if (!generatedCMake.exists()) {
            copy {
                from fallbackCodegenJniDir
                into generatedCodegenJniDir
            }
        }
    }
}

preBuild.dependsOn(prepareFallbackCodegenJni)

repositories {
    mavenLocal()
    maven {
        // As RN is not updated in jcenter anymore, we'll have to grab it from npm
        // Make sure you have installed the react-native npm package before compiling
        url '../node_modules/react-native/android'
    }

    mavenCentral()
    google()
}

dependencies {
    // The vendored KotlinAudio's own dependencies, at the versions its v2.1.0 build declares.
    implementation 'io.coil-kt:coil:2.2.0'
    api 'com.google.android.exoplayer:exoplayer:2.19.0'
    api 'com.google.android.exoplayer:extension-mediasession:2.19.0'
    api 'com.jakewharton.timber:timber:5.0.1'

    //noinspection GradleDynamicVersion
    implementation "com.facebook.react:react-native:+"

    // Make sure we're using androidx
    implementation "androidx.core:core-ktx:1.9.0"
    implementation "androidx.media:media:1.6.0"
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"
    implementation "androidx.lifecycle:lifecycle-process:2.5.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.3"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.6.3"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "junit:junit:4.13.2"
}
